[workspace]
resolver = "3"
members = [
    "crates/streamling-config",
    "crates/streamling-common",
    "crates/streamling-core",
    "crates/streamling-connectors",
    "crates/streamling-plugin",
    "crates/streamling-plugin/streamling-plugin-derive",
    "crates/streamling-state",
    "crates/streamling",
    "crates/streamling-flink-compat",
    "crates/streamling-e2e",
    "crates/streamling-bench",
]
exclude = [
    "plugin_examples",
]

[workspace.package]
license-file = "LICENSE.txt"
repository = "https://github.com/goldsky-io/streamling"
homepage = "https://www.streamling.dev"
keywords = ["streaming", "stream-processing", "arrow", "datafusion"]

[workspace.lints.clippy]
too_many_arguments = "allow"

[workspace.dependencies]
# Internal crates. path + version lets `cargo publish` rewrite the path deps into
# registry deps; the version is maintained here once and inherited via `{ workspace = true }`.
streamling-config        = { path = "crates/streamling-config", version = "0.3.0" }
streamling-common        = { path = "crates/streamling-common", version = "0.3.0" }
streamling-state         = { path = "crates/streamling-state", version = "0.3.0" }
streamling-core          = { path = "crates/streamling-core", version = "0.3.0" }
streamling-connectors    = { path = "crates/streamling-connectors", version = "0.3.0" }
streamling-flink-compat  = { path = "crates/streamling-flink-compat", version = "0.3.0" }
streamling-plugin        = { path = "crates/streamling-plugin", version = "0.2.1" }
streamling-plugin-derive = { path = "crates/streamling-plugin/streamling-plugin-derive", version = "0.3.0" }
streamling-e2e           = { path = "crates/streamling-e2e", version = "0.3.0" }

# Core DataFusion ecosystem
datafusion = { version = "54.0.0", features = ["avro", "backtrace"] }
datafusion-expr = "54.0.0"
arrow = "58.3.0"
arrow-schema = { version = "58.3.0", default-features = false }
arrow-data = "58.3.0"
arrow-json = "58.3.0"
arrow-avro = "58.3.0"
# Bumped to 0.13 to match DataFusion 54's `object_store = "0.13.x"`
object_store = { version = "0.13", features = ["aws", "gcp"] }

tokio = { version = "1.0", features = ["rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }

sqlx = { version = "0.8.5", features = ["runtime-tokio", "postgres", "json", "sqlite", "tls-rustls"] }

config = { version = "0.14.1", features = ["yaml", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

num-traits = "0.2.19"
uint = "0.10"
futures = "0.3"
async-stream = "0.3"
crossbeam = "0.8.4"
crossbeam-channel = "0.5"
once_cell = "1.20.3"
parking_lot = "0.12.3"

serde = "1.0"
serde_derive = "1.0"
serde_json = { version = "1.0", features = ["raw_value"] }
serde_yaml = "0.9"

async-trait = "0.1.83"

rdkafka = { version = "0.37.0", features = ["ssl", "tracing"] }
schema_registry_converter = { version = "=4.3.0", features = ["avro"] }
apache-avro = { version = "0.17", default-features = false }
# must match the version in datafusion and schema_registry_converter

uuid = { version = "1.11.0", features = ["v4", "v7"] }
reqwest = { version = "0.12", features = ["stream"] }
reqwest-retry = "0.7.0"
reqwest-middleware = "0.4.0"
bytes = "1.11"
flate2 = "1.0"
zstd = "0.13"
lz4_flex = "0.11"
indoc = "2.0.6"
regex = "1.11.1"
percent-encoding = "2.3.1"
lazy_static = "1.5.0"
humantime = "2.2.0"
bigdecimal = "0.4.8"
clap = { version = "4.5", features = ["derive"] }

# WASM dependencies
extism = "1.21.0"

# TypeScript to JavaScript transpiler dependencies
swc = { version = "40.0.0", default-features = false }
swc_common = { version = "14.0.4", features = ["tty-emitter"] }
swc_ecma_ast = "15.0.0"
swc_ecma_lexer = "23.0.1"
heck = "0.5.0"

# Plugin / FFI dependencies
datafusion-ffi = "54.0.0"
abi_stable = "0.11.3"
async-ffi   = { version = "0.5", features = ["abi_stable"] }

#Utilities
#helps with creating wrapper structs by delegating work to the wrapped traits
delegate = "0.13"
thiserror = "2.0.16"
anyhow = "1.0"
itertools = "0.14.0"
enum-display = "0.1.4"
dashmap = "6.1.0"
fixed_deque = "1.4.0"
indexmap = { version = "2.7.0", features = ["serde"] }

# Telemetry dependencies
opentelemetry_sdk = "0.30.0"
opentelemetry = "0.30.0"
opentelemetry-otlp = { version = "0.30.0", features = ["grpc-tonic"] }
tonic = { version = "0.13", default-features = false, features = ["transport"] }
chrono = "0.4.41"

# Encoding and hashing
bs58 = "0.5.1"
arrow-buffer = "58.3.0"
base64 = "0.22.1"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }
sha3 = "0.10"
hex = "0.4"
num-bigint = "0.4"
paste = "1.0.15"

# dev dependencies
axum = "0.8.1"
serial_test = "3.2.0"
urlencoding = "2.1.3"
rand = "0.8"
mockito = "1.6"

