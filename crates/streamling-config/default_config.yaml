---
# Default configuration compiled into the streamling binary via include_str!.
# These values are the baseline layer; an external config file and STREAMLING__*
# environment variables override them (precedence: embedded < file < env).
application_id: "local_app_v1"
log_format: "text" # "text" or "json"
pipeline_definition_location: "./pipeline.yaml"
record_batch_interval_ms: "100"
record_batch_size: "1000"
# uncomment for debugging pipeline e2e
# num_records_before_stop: 1
# the number of in-flight record batches in internal channels
internal_buffer_size: "10"
checkpoint_interval_sec: "5"
# if false (default), primary keys are NOT enforced and warnings are logged instead of errors
# if true, missing primary keys will cause pipeline startup to fail
# enforce_primary_keys: false
state_backend:
  backend_type: "Sqlite"
  sqlite:
    database_path: "./state.db"
  postgres:
    host: "localhost"
    port: 5432
    db: "streamling"
    user: "graph-node"
    password: ""
    sslmode: "require" # Options: disable, allow, prefer, require, verify-ca, verify-full (default: require)
dynamic_table_backend:
  postgres:
    host: "localhost"
    port: 5432
    db: "streamling"
    user: "graph-node"
    password: ""
    sslmode: "require"
    cache_enabled: false
external_http_handler:
  trigger_max_count: "2000"
  operator_timeout_sec: "300"
  # the number of in-flight record batches executed concurrently by the external HTTP handler
  buffer_size: "25"
wasm_script: {}
plugin: {}
kafka_source:
  brokers: "localhost:9092"
  security_protocol: "plaintext"
  sasl_mechanism:
  sasl_username:
  sasl_password:
  schema_registry_url: "http://localhost:18081"
  schema_registry_username:
  schema_registry_password:
  consumer_group_id:
  client_id:
  lag_report_interval_ms: "60000"
kafka_sink:
  brokers: "localhost:9092"
  security_protocol: "plaintext"
  sasl_mechanism:
  sasl_username:
  sasl_password:
  schema_registry_url: "http://localhost:18081"
  schema_registry_username:
  schema_registry_password:
  client_id:
clickhouse_source:
  url: "http://localhost:8123"
  user: default
  password: ""
  database: default
  page_size: "10000000"
clickhouse_sink:
  url: "http://localhost:8123"
  user: default
  password: ""
  database: default
  # Defaults for sinks that omit batch_size / batch_flush_interval. 100k rows
  # with a 1s flush measured ~12x the throughput of the previous fallback
  # (record_batch_size, 1000) on row-heavy backfills. Override per-process with
  # STREAMLING__CLICKHOUSE_SINK__BATCH_SIZE and
  # STREAMLING__CLICKHOUSE_SINK__BATCH_FLUSH_INTERVAL, or per-sink in the
  # pipeline YAML.
  batch_size: 100000
  batch_flush_interval: "1s"
print_sink:
  sample_every: "1"
postgres_sink:
  host: 127.0.0.1
  port: 5432
  user: "graph-node"
  pass: ""
  db: "postgres"
  sslmode: "disable"
  batch_flush_interval: "1s"
  batch_size: 100
open_telemetry_metrics:
  # any non-url value will lead to metrics not being recorded and exported
  # for prometheus running locally, use "http://localhost:9090/api/v1/otlp/v1/metrics"
  ingestion_endpoint: "none"
  # acceptable values are "http/json", "http/protobuf"  or "grpc"
  endpoint_protocol: ""
  # how often to flush accumulated metrics to the endpoint
  batch_interval_secs: 15
  # expected in format "key1:value1,key2:value2"
  global_tags: ""
  # comma-separated regex patterns to deny metrics emission - if metric name matches any pattern, it won't be emitted
  # example: ".*_debug_.*,test_.*,internal_.*"
  metric_deny_list: "kafka_consumer.msg_decode_latency,kafka_producer.msg_encode_latency"
test_settings:
  telemetry_assertions_enabled: true
  prometheus_max_attempts: 30
  prometheus_sleep_ms: 500
live_data_inspect_enabled: false
live_data_inspect:
  records_per_topology_node: 15
  refresh_in_secs: 30
admin_api_port: 3000
# job_mode: false  # When true, hybrid sources terminate after bounded phases complete
