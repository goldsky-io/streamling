[package]
name = "streamling"
version = "0.2.0"
edition = "2024"
rust-version = "1.90.0"
description = "Streamling: Performant and extensible streaming data runtime"
readme = "../../README.md"
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "streamling"
path = "src/main.rs"

[dependencies]
# Internal dependencies
streamling-common = { workspace = true }
streamling-core = { workspace = true }
streamling-connectors = { workspace = true }
streamling-config = { workspace = true }
streamling-state = { workspace = true }

# Core dependencies
clap.workspace = true
datafusion.workspace = true
tokio.workspace = true
humantime.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
arrow-schema.workspace = true
futures.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
serde.workspace = true

# Upstream mimalloc v3 sources. We use `default-features = false` because we
# don't want libmimalloc-sys's own link step; build.rs locates `static.c` via
# `DEP_MIMALLOC_INCLUDE_DIR` (propagated through libmimalloc-sys's
# `links = "mimalloc"`), compiles it with `-DMI_MALLOC_OVERRIDE`, and links the
# bare object + `--export-dynamic` so the binary exports malloc/free/etc. for
# dlopen'd plugins to resolve (one shared heap). See build.rs for details.
libmimalloc-sys = { version = "0.1.49", default-features = false }

[dev-dependencies]
# Test dependencies
serde.workspace = true
serde_json.workspace = true
# dlsym allocator-identity check in tests/allocator_override.rs.
libc = "0.2"

[build-dependencies]
# Compiles the mimalloc override object from libmimalloc-sys's sources (see build.rs).
cc = "1"
