name: streamling

on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Dockerfile*"
      - ".github/workflows/streamling.yml"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ github.token }}
          filters: |
            core:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'Dockerfile*'
              - '.github/workflows/streamling.yml'

  validate-and-test:
    needs: [changes]
    if: needs.changes.outputs.core == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2204
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "main"
            cargo-args: ""
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: "10G"
    steps:
      - uses: actions/checkout@v4
      - name: Configure Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy, rustfmt
      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
      - name: Set SCCACHE_DIR env
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> $GITHUB_ENV
      - name: Prepare sccache dir
        run: mkdir -p "$SCCACHE_DIR"
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-streamling-${{ runner.os }}-1.90.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-streamling-${{ runner.os }}-1.90.0-
      - name: Setup rust cache
        uses: useblacksmith/rust-cache@v3
        with:
          shared-key: "streamling"
          cache-targets: true
          cache-on-failure: true
      - name: Run linters
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings --A clippy::result_large_err
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Run unit tests
        run: cargo nextest run --workspace --locked -P ci --exclude streamling-e2e
        env:
          RUST_LOG: info
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_TEST_DEBUG: 0
          RUSTC_WRAPPER: sccache
        timeout-minutes: 15

  # ==========================================================================
  # Build release binary, share via artifact.
  # ==========================================================================
  build-release-main:
    needs: [changes]
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-8vcpu-ubuntu-2204
            os: linux
            arch: x86_64
          - runner: blacksmith-8vcpu-ubuntu-2204-arm
            os: linux
            arch: aarch64
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4

      # Try to restore a previously-built binary.
      # Key covers all source inputs that affect the build output.
      - name: Cache main binary
        id: main-cache
        uses: actions/cache@v4
        with:
          path: target/release/streamling
          key: main-bin-v2-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}

      # Everything below only runs on cache miss
      - name: Configure Rust toolchain
        if: steps.main-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@1.90.0
      - name: Install sccache
        if: steps.main-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
      - name: Set SCCACHE_DIR env
        if: steps.main-cache.outputs.cache-hit != 'true'
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> $GITHUB_ENV
      - name: Prepare sccache dir
        if: steps.main-cache.outputs.cache-hit != 'true'
        run: mkdir -p "$SCCACHE_DIR"
      - name: Cache sccache
        if: steps.main-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-main-${{ matrix.os }}-${{ matrix.arch }}-1.90.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-main-${{ matrix.os }}-${{ matrix.arch }}-1.90.0-
      - name: Setup rust cache
        if: steps.main-cache.outputs.cache-hit != 'true'
        uses: useblacksmith/rust-cache@v3
        with:
          shared-key: "v0-release-main-${{ matrix.os }}-${{ matrix.arch }}"
          cache-targets: true
          cache-on-failure: true
      - name: Build release binary
        if: steps.main-cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked
        env:
          CARGO_INCREMENTAL: 0
          RUSTC_WRAPPER: sccache
          SCCACHE_CACHE_SIZE: "10G"
          LIBZ_SYS_STATIC: 1
          PKG_CONFIG_ALL_STATIC: 1
      - name: Show sccache stats
        if: steps.main-cache.outputs.cache-hit != 'true'
        run: sccache --show-stats || true

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: release-binary-${{ matrix.os }}-${{ matrix.arch }}
          path: target/release/streamling
          retention-days: 1
          if-no-files-found: error

  e2e-tests:
    needs: [changes, build-release-main]
    if: needs.changes.outputs.core == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2204
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      # Rust toolchain + caching (needed to compile the e2e test crate)
      - name: Configure Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
      - name: Setup rust cache
        uses: useblacksmith/rust-cache@v3
        with:
          shared-key: "v0-streamling-e2e"
          cache-targets: true
          cache-on-failure: true

      # Reuse the release binary from build-release-main instead of rebuilding.
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: release-binary-linux-x86_64
          path: release-artifacts/
      - name: Install release binary
        run: |
          mkdir -p target/release
          cp release-artifacts/streamling target/release/
          chmod +x target/release/streamling

      # Infrastructure setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Docker Builder
        uses: useblacksmith/setup-docker-builder@v1
      - name: Pre-pull e2e images
        run: |
          set -euo pipefail
          images=(
            "postgres:15-alpine"
            "mariadb:10.11"
            "redpandadata/redpanda:v24.2.4"
            "clickhouse/clickhouse-server:latest-alpine"
            "prom/prometheus:latest"
            "rancher/k3s:v1.28.4-k3s1"
          )
          for image in "${images[@]}"; do
            echo "Pulling $image"
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                break
              fi
              echo "Retrying $image pull (attempt $attempt/3)..."
              sleep 5
            done
          done
      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      - name: Setup k3s cluster
        run: ./scripts/k3s-setup.sh
        timeout-minutes: 5

      # Build and run e2e tests
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Build e2e tests
        run: cargo test -p streamling-e2e --no-run
        env:
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_TEST_DEBUG: 0
      - name: Run e2e tests
        run: |
          set -euo pipefail
          eval "$(./scripts/k3s-setup.sh --env-only)"
          export E2E_STREAMLING_BIN="$(pwd)/target/release/streamling"
          export STREAMLING__PLUGIN__PATH=""
          export STREAMLING__PLUGIN__PREPROCESSOR_IDS=""
          cargo nextest run -p streamling-e2e -j 4
        env:
          RUST_LOG: info
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_TEST_DEBUG: 0
        timeout-minutes: 20

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n streamling-e2e -o wide
          echo ""
          echo "=== Pod Events ==="
          kubectl get events -n streamling-e2e --sort-by='.lastTimestamp' | tail -30
          echo ""
          echo "=== Pod Logs ==="
          for pod in $(kubectl get pods -n streamling-e2e -o name); do
            echo "--- $pod ---"
            kubectl logs $pod -n streamling-e2e --tail=100 || true
          done
          echo ""
          echo "=== Docker Stats ==="
          docker stats --no-stream || true

  # ==========================================================================
  # Image push jobs: download pre-built binary and package into Docker image.
  # No Rust compilation needed — just checkout (for Dockerfile) + Docker push.
  # ==========================================================================
  build-and-push-image-main:
    needs: [validate-and-test, e2e-tests, build-release-main]
    if: ${{ always() && github.ref_name == 'main' && needs.build-release-main.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-8vcpu-ubuntu-2204
            os: linux
            arch: x86_64
            image_arch: amd64
          - runner: blacksmith-8vcpu-ubuntu-2204-arm
            os: linux
            arch: aarch64
            image_arch: arm64
    steps: &image_push_steps
      - name: Mask AWS account ID
        env:
          AWS_DEV_ACCOUNT_ID: ${{ secrets.AWS_DEV_ACCOUNT_ID }}
        run: echo "::add-mask::$AWS_DEV_ACCOUNT_ID"
      - uses: actions/checkout@v4
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: release-binary-${{ matrix.os }}-${{ matrix.arch }}
          path: release-artifacts/
      - name: Install release binaries
        run: |
          mkdir -p target/release
          cp release-artifacts/streamling target/release/
          chmod +x target/release/streamling
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_GHA_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Docker Builder
        uses: useblacksmith/setup-docker-builder@v1
      - name: Generate tags
        id: generate_tags
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: streamling
          IMAGE_TAG: ${{ github.sha }}
          ARCH: ${{ matrix.image_arch }}
        run: |
          SAFE_IMAGE_BRANCH=$(echo ${{ github.ref_name }} | tr / -)
          TAG_SHA=$ECR_REGISTRY/$ECR_REPOSITORY:$SAFE_IMAGE_BRANCH-$IMAGE_TAG-$ARCH
          TAG_LATEST=$ECR_REGISTRY/$ECR_REPOSITORY:$SAFE_IMAGE_BRANCH-latest-$ARCH
          echo "tags=$TAG_SHA,$TAG_LATEST" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
          echo "tag_latest=$TAG_LATEST" >> "$GITHUB_OUTPUT"
      - name: Build and push Docker image (prebuilt artifacts)
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.generate_tags.outputs.tags }}
          provenance: false

  build-and-push-image-branch:
    needs: [validate-and-test, build-release-main]
    if: ${{ always() && github.ref_name != 'main' && needs.validate-and-test.result != 'failure' && needs.build-release-main.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-8vcpu-ubuntu-2204
            os: linux
            arch: x86_64
            image_arch: amd64
          - runner: blacksmith-8vcpu-ubuntu-2204-arm
            os: linux
            arch: aarch64
            image_arch: arm64
    steps: *image_push_steps

  create-manifest-main:
    needs: [build-and-push-image-main]
    if: ${{ always() && github.ref_name == 'main' && needs.build-and-push-image-main.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Mask AWS account ID
        env:
          AWS_DEV_ACCOUNT_ID: ${{ secrets.AWS_DEV_ACCOUNT_ID }}
        run: echo "::add-mask::$AWS_DEV_ACCOUNT_ID"
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_GHA_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Create and push multi-arch manifest
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: streamling
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SAFE_IMAGE_BRANCH=$(echo ${{ github.ref_name }} | tr / -)
          TAG_SHA=$ECR_REGISTRY/$ECR_REPOSITORY:$SAFE_IMAGE_BRANCH-$IMAGE_TAG
          TAG_LATEST=$ECR_REGISTRY/$ECR_REPOSITORY:$SAFE_IMAGE_BRANCH-latest

          docker manifest create $TAG_SHA \
            $TAG_SHA-amd64 \
            $TAG_SHA-arm64
          docker manifest push $TAG_SHA

          docker manifest create $TAG_LATEST \
            $TAG_LATEST-amd64 \
            $TAG_LATEST-arm64
          docker manifest push $TAG_LATEST

          echo "Created multi-arch manifests:"
          echo "  - $TAG_SHA"
          echo "  - $TAG_LATEST"

  create-manifest-branch:
    needs: [build-and-push-image-branch]
    if: ${{ always() && github.ref_name != 'main' && needs.build-and-push-image-branch.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Mask AWS account ID
        env:
          AWS_DEV_ACCOUNT_ID: ${{ secrets.AWS_DEV_ACCOUNT_ID }}
        run: echo "::add-mask::$AWS_DEV_ACCOUNT_ID"
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_GHA_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Create and push multi-arch manifest
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: streamling
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SAFE_IMAGE_BRANCH=$(echo ${{ github.ref_name }} | tr / -)
          TAG_SHA=$ECR_REGISTRY/$ECR_REPOSITORY:$SAFE_IMAGE_BRANCH-$IMAGE_TAG
          TAG_LATEST=$ECR_REGISTRY/$ECR_REPOSITORY:$SAFE_IMAGE_BRANCH-latest

          docker manifest create $TAG_SHA \
            $TAG_SHA-amd64 \
            $TAG_SHA-arm64
          docker manifest push $TAG_SHA

          docker manifest create $TAG_LATEST \
            $TAG_LATEST-amd64 \
            $TAG_LATEST-arm64
          docker manifest push $TAG_LATEST

          echo "Created multi-arch manifests:"
          echo "  - $TAG_SHA"
          echo "  - $TAG_LATEST"

  # ==========================================================================
  # Rolling 'nightly' prerelease from every green main commit.
  # Linux binaries only; versioned releases remain the 'latest' release.
  # ==========================================================================
  publish-prerelease:
    needs: [validate-and-test, e2e-tests, build-release-main]
    if: github.ref_name == 'main'
    # Serialize delete/recreate of the rolling tag across overlapping main runs.
    concurrency:
      group: publish-prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-binary-*-*
          path: release-artifacts/
      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          found=0
          for dir in release-artifacts/release-binary-*; do
            [ -d "$dir" ] || continue
            found=1
            base=$(basename "$dir")
            os_arch=${base#release-binary-}
            chmod +x "$dir/streamling"
            tar -czf "release-assets/streamling-${os_arch}.tar.gz" -C "$dir" streamling
          done
          if [ "$found" -eq 0 ]; then
            echo "No release artifact directories found" >&2
            exit 1
          fi
      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly --prerelease --target "$GITHUB_SHA" --title "nightly (${GITHUB_SHA:0:7})" --notes "Rolling prerelease from main @ $GITHUB_SHA. Linux binaries only; use the versioned releases for macOS/Windows." release-assets/*
