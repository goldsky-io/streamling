name: E2E Tests

on:
  workflow_call:
    inputs:
      streamling_ref:
        description: "Git ref for the streamling repo"
        type: string
        default: 'main'
    secrets:
      GH_READ_TOKEN:
        required: true

jobs:
  e2e:
    runs-on: blacksmith-8vcpu-ubuntu-2204
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: "10G"
    steps:
      - name: Checkout streamling
        uses: actions/checkout@v4
        with:
          # TODO: rename back
          repository: goldsky-io/streamling-private
          ref: ${{ inputs.streamling_ref }}
          token: ${{ secrets.GH_READ_TOKEN }}
          path: streamling

      - name: Configure git for private deps
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"

      # Rust toolchain + caching
      - name: Configure Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0
      - name: Install sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache
      - name: Set SCCACHE_DIR env
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> $GITHUB_ENV
      - name: Prepare sccache dir
        run: mkdir -p "$SCCACHE_DIR"
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-e2e-${{ runner.os }}-1.90.0-${{ hashFiles('streamling/Cargo.lock') }}
          restore-keys: |
            sccache-e2e-${{ runner.os }}-1.90.0-
      - name: Setup rust cache
        uses: useblacksmith/rust-cache@v3
        with:
          shared-key: "v0-streamling-e2e"
          cache-targets: true
          cache-on-failure: true
          workspaces: streamling

      - name: Build streamling binary
        working-directory: streamling
        run: cargo build --release --locked
        env:
          CARGO_INCREMENTAL: 0
          LIBZ_SYS_STATIC: 1
          PKG_CONFIG_ALL_STATIC: 1

      # Infrastructure setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Docker Builder
        uses: useblacksmith/setup-docker-builder@v1
      - name: Pre-pull e2e images
        run: |
          set -euo pipefail
          images=(
            "postgres:15-alpine"
            "mariadb:10.11"
            "redpandadata/redpanda:v24.2.4"
            "clickhouse/clickhouse-server:latest-alpine"
            "prom/prometheus:latest"
            "rancher/k3s:v1.28.4-k3s1"
          )
          for image in "${images[@]}"; do
            echo "Pulling $image"
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                break
              fi
              echo "Retrying $image pull (attempt $attempt/3)..."
              sleep 5
            done
          done
      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      - name: Setup k3s cluster
        working-directory: streamling
        run: ./scripts/k3s-setup.sh
        timeout-minutes: 5

      # Build and run e2e tests
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Build e2e tests
        working-directory: streamling
        run: cargo test -p streamling-e2e --no-run
        env:
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_TEST_DEBUG: 0
      - name: Run e2e tests
        working-directory: streamling
        run: |
          set -euo pipefail
          eval "$(./scripts/k3s-setup.sh --env-only)"
          export E2E_STREAMLING_BIN="$(pwd)/target/release/streamling"
          export STREAMLING__PLUGIN__PATH=""
          export STREAMLING__PLUGIN__PREPROCESSOR_IDS=""
          cargo nextest run -p streamling-e2e -j 4
        env:
          RUST_LOG: info
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_TEST_DEBUG: 0
        timeout-minutes: 20

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n streamling-e2e -o wide
          echo ""
          echo "=== Pod Events ==="
          kubectl get events -n streamling-e2e --sort-by='.lastTimestamp' | tail -30
          echo ""
          echo "=== Pod Logs ==="
          for pod in $(kubectl get pods -n streamling-e2e -o name); do
            echo "--- $pod ---"
            kubectl logs $pod -n streamling-e2e --tail=100 || true
          done
          echo ""
          echo "=== Docker Stats ==="
          docker stats --no-stream || true
