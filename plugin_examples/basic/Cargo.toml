[package]
name = "plugin_example_basic"
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"

[workspace]

[lib]
name = "plugin_example_basic"
crate-type = ["cdylib", "rlib"]

[dependencies]
streamling-plugin = { path = "../../crates/streamling-plugin" }

abi_stable = "0.11.3"
arrow = { version = "55.2.0" }
async-trait = "0.1.83"
arrow-schema = { version = "55.2.0", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3.0", features = ["env-filter", "json"] }
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
