name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  id-token: write

# Cancel in-progress reviews when new commits are pushed
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Job 1: Deterministic risk scoring (fast, free)
  # ──────────────────────────────────────────────────────────────────────
  risk-scoring:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      risk_json: ${{ steps.score.outputs.risk_json }}
      overall_risk: ${{ steps.score.outputs.overall_risk }}
      risk_level: ${{ steps.score.outputs.risk_level }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} --name-only > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Compute risk scores
        id: score
        run: |
          BASE_REF=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD 2>/dev/null || echo "origin/${{ github.event.pull_request.base.ref }}")
          echo "Using base ref: $BASE_REF"

          python scripts/ai-review/risk_score.py \
            --changed-files changed_files.txt \
            --config scripts/ai-review/review_config.json \
            --base-ref "$BASE_REF" \
            --output risk_report.json

          # Pass key values as outputs for downstream jobs
          echo "overall_risk=$(jq -r .overall_risk risk_report.json)" >> "$GITHUB_OUTPUT"
          echo "risk_level=$(jq -r .risk_level risk_report.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: risk-report
          path: risk_report.json

  # ──────────────────────────────────────────────────────────────────────
  # Job 2: Claude Code review (depends on risk scoring)
  # ──────────────────────────────────────────────────────────────────────
  claude-review:
    needs: [risk-scoring]
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: risk-report

      # Read model from config so it's centrally configurable
      - name: Read review config
        id: config
        run: |
          MODEL=$(jq -r '.model // "claude-opus-4-20250514"' scripts/ai-review/review_config.json)
          MAX_TURNS=$(jq -r '.max_turns // 15' scripts/ai-review/review_config.json)
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "max_turns=$MAX_TURNS" >> "$GITHUB_OUTPUT"
          echo "Using model: $MODEL, max_turns: $MAX_TURNS"

      - name: Format Risk Data
        id: risk_data
        run: |
          python3 -c "
          import json, os
          with open('risk_report.json') as f:
              r = json.load(f)
          
          lines = []
          mapping = {
              'historical_volatility': 'high churn',
              'complexity': 'complex file',
              'blast_radius': 'high blast radius',
              'change_density': 'large change',
              'test_coverage_delta': 'undertested'
          }
          for path, details in list(r.get('files', {}).items())[:5]:
              composite = details['composite']
              reasons = [mapping.get(k, k.replace('_', ' ')) for k, v in details['signals'].items() if v >= 0.5]
              reason_str = ', '.join(reasons) if reasons else 'multiple moderate signals'
              lines.append(f'| {path} | {composite:.2f}/1.00 | {reason_str} |')
          
          table = '\n'.join(lines) if lines else '| None | 0.00 | No changed files scored |'
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('risk_table<<EOF\n' + table + '\nEOF\n')
          "

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          # Maestro opens/updates PRs as the goldsky-maestro GitHub App. Without
          # allowlisting it, claude-code-action aborts with "Workflow initiated by
          # non-human actor" before reviewing, failing this check on every bot PR.
          allowed_bots: "goldsky-maestro"
          claude_args: |
            --model ${{ steps.config.outputs.model }}
            --max-turns ${{ steps.config.outputs.max_turns }}
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr comment:*),Read(*),codebase-memory:*"
            --mcp-config '{"mcpServers": {"codebase-memory": {"command": "npx", "args": ["-y", "codebase-memory-mcp"]}}}'
          prompt: |
            You are an expert Rust code reviewer for the Streamling project — a data
            processing engine built on Apache Arrow and DataFusion. You review pull
            requests for correctness, safety, convention compliance, and risk.

            ## codebase-memory-mcp Code Intelligence Enhanced
            You are configured with DeusData's high-performance semantic codebase-memory-mcp indexing tool.
            This registers structural tools like `get_symbols`, `get_references`, `get_definitions`, `semantic_query`,
            and `get_call_graph` directly into your workspace.
            **Use codebase-memory tools instead of sequential file reads or broad greps to resolve types, classes, call chains, and cross-module implications with optimal efficiency.**

            ## CRITICAL: TURN BUDGET & EFFICIENCY Rules
            You have an absolute Turn Budget of at most 5 turns (keep it minimal):
            - Step 1: Run `gh pr diff` first to see changed lines.
            - Step 2: If the diff references unfamiliar modules, types, traits, or downstream operators, use the `codebase-memory` tools (or regular `Read` file tools) to selectively resolve them.
            - Step 3: Stop making tool calls immediately once you have enough context, then compile your findings.
            - **DO NOT** run `git status`, look up git logs, or try to run tests/compiles.
            - Any attempt to use unauthorized tools or exceed the turn limit will fail the GitHub Action.

            ### Step-by-Step Execution Plan:
            1. **Turn 1:** Fetch the PR diff by running exactly: `gh pr diff ${{ github.event.pull_request.number }}`.
            2. **Turns 2-3 (Optional):** Use `codebase-memory` tools (e.g. `semantic_query`, `get_references`) or direct `Read` to clear any critical context gaps (no-op if the diff is trivial/self-contained).
            3. **Final Turn:** Analyze the gathered information against the rules below, and post your SINGLE review comment using exactly: `gh pr comment ${{ github.event.pull_request.number }} --body "..."`. Do NOT ask follow-up questions and conclude immediately.
            ## Context

            - **Repository:** ${{ github.repository }}
            - **PR Number:** ${{ github.event.pull_request.number }}
            - **PR Title:** ${{ github.event.pull_request.title }}
            - **Overall Risk Level:** ${{ needs.risk-scoring.outputs.risk_level }}
            - **Overall Risk Score:** ${{ needs.risk-scoring.outputs.overall_risk }}

            ## Riskiest Files Breakdown (Pre-computed; do not query or calculate)
            | File | Risk Score | Principal Risk Drivers |
            |------|------------|------------------------|
            ${{ steps.risk_data.outputs.risk_table }}

            ## AI Review Rules & Rule IDs (from AGENTS.md)
            Evaluate the PR diff against these rules. Match violations with their exact Rule ID:

            ### A. Convention Rules
            - **CONV-001 (Block):** Bug fix PRs MUST include a failing unit test that reproduces the issue. Check if a bug fix has accompanying tests (e.g. filenames with `test` or modifications to tests).
            - **CONV-002 (Block):** `just fix && just lint` must pass (no clippy warnings under `-D warnings`).
            - **CONV-004 (Recommend):** Pipeline-level features should have an e2e test.
            - **CONV-005 (Recommend):** Changes should be minimal and easy to understand — prefer small, focused PRs.
            - **CONV-006 (Minor):** Commit messages should use conventional format (`feat:`, `fix:`, `chore:`, etc.).

            ### B. Rust Rules
            - **RUST-001 (Block):** No `.unwrap()` in non-test production code. Use `?`, `.expect("reason")`, or run-time handling instead.
            - **RUST-002 (Block):** `unsafe` blocks must have a `// SAFETY:` comment explaining soundness.
            - **RUST-003 (Recommend):** Prefer `StreamlingError` over `anyhow::Error` for public APIs.
            - **RUST-004 (Recommend):** New public APIs should have doc comments.
            - **RUST-005 (Minor):** Avoid `clone()` where a reference or `Cow` would suffice.

            ### C. Connector Rules (Kafka, ClickHouse, Postgres)
            - **CONN-001 (Block):** Connection errors must be retriable (`StreamlingError::retriable`).
            - **CONN-002 (Recommend):** New sink configs should use `#[serde(deny_unknown_fields)]`.
            - **CONN-003 (Recommend):** Resource cleanup (connections, cursors) must happen in `Drop` impls or explicit close.

            ### D. Pipeline / Topology Rules
            - **PIPE-001 (Block):** Arrow schema changes must be backward-compatible or versioned.
            - **PIPE-002 (Recommend):** New transforms must handle empty `RecordBatch`es gracefully.
            - **PIPE-003 (Recommend):** Checkpoint-related changes must preserve exactly-once semantics.

            ## Format your review

            Post a SINGLE comment on the PR using:
            `gh pr comment ${{ github.event.pull_request.number }} --body "..."`

            Use this exact markdown format for the comment:

            ```
            ## AI Code Review

            **Risk Level:** RISK_BADGE ${{ needs.risk-scoring.outputs.risk_level }} (score: ${{ needs.risk-scoring.outputs.overall_risk }}/1.00)

            Where RISK_BADGE is:
            - 🔴 for HIGH (score >= 0.7)
            - 🟡 for MEDIUM (score >= 0.4)
            - 🟢 for LOW (score < 0.4)

            ### Findings

            #### 🚫 Blocking (must fix before merge)
            [List blocking issues with rule IDs from our ruleset above, or "None"]

            #### 💡 Recommended (should fix)
            [List recommendations, or "None"]

            #### 📝 Minor (nits)
            [List minor items, or "None"]

            ### Risk Breakdown
            | File | Risk | Reason |
            |------|------|--------|
            ${{ steps.risk_data.outputs.risk_table }}

            ### Summary
            [2-3 sentence summary of quality and risk profile]
            ```

            ## Constraints
            - Only report findings you are confident about (confidence >= 80%).
            - Reference rule IDs when applicable (e.g., RUST-001, CONV-002).
            - Do NOT flag issues in test code (files matching `*_test.rs`, `test_*`, `tests/`).
            - Do NOT flag `.unwrap()` in test code — it is explicitly acceptable.
            - If the PR is low-risk and looks good, say so briefly — don't invent issues.

