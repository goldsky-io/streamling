name: plugin-examples

on:
  push:
    paths:
      - "plugin_examples/**"
      - ".github/workflows/plugin-examples.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: blacksmith-8vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure Rust toolchain
        uses: dtolnay/rust-toolchain@06e5a564a0556e338780f5aecf2e7dcc9b267f07 # 1.91.1
        with:
          toolchain: 1.91.1
          components: clippy, rustfmt
      # kache setup mirrors streamling.yml (see the comment there).
      - name: Setup kache
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v0.28.1
          s3-bucket: github-action-kache
          s3-endpoint: https://t3.storage.dev
          s3-region: auto
          s3-access-key-id: ${{ secrets.KACHE_TIGRIS_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_TIGRIS_SECRET_ACCESS_KEY }}
          manifest-key: streamling-plugin-examples
          cache-c-cpp: "true"
          pr-comment: "false"

      - name: Setup rust cache (plugin_examples/basic)
        uses: useblacksmith/rust-cache@f53e7f127245d2a269b3d90879ccf259876842d5 # v3
        with:
          shared-key: "plugin-examples"
          workspaces: |
            plugin_examples/basic -> plugin_examples/basic/target
            plugin_examples/low_level -> plugin_examples/low_level/target
          cache-targets: true
          cache-on-failure: true

      - name: Build basic example
        working-directory: plugin_examples/basic
        run: cargo build --locked

      - name: Build low_level example
        working-directory: plugin_examples/low_level
        run: cargo build --locked
