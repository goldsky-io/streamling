[package]
name = "streamling"
version = "0.2.0"
edition = "2024"
rust-version = "1.90.0"
description = "Streamling: Performant and extensible streaming data runtime"
readme = "../../README.md"
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "streamling"
path = "src/main.rs"

[dependencies]
# Internal dependencies
streamling-common = { workspace = true }
streamling-core = { workspace = true }
streamling-connectors = { workspace = true }
streamling-config = { workspace = true }
streamling-state = { workspace = true }

# Core dependencies
clap.workspace = true
datafusion.workspace = true
tokio.workspace = true
humantime.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
arrow-schema.workspace = true
futures.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
serde.workspace = true

# mimalloc v3 source (no vendored C in this repo). We depend on libmimalloc-sys
# purely to fetch the upstream mimalloc v3 sources; build.rs compiles
# `static.c` with `-DMI_MALLOC_OVERRIDE` and links the bare object directly so
# the binary defines malloc/free/etc. with `--export-dynamic` exposing them for
# dlopen'd plugins to resolve (one shared heap).
libmimalloc-sys = { version = "0.1.49", default-features = false }

[dev-dependencies]
# Test dependencies
serde.workspace = true
serde_json.workspace = true
libc = "0.2"

[build-dependencies]
# Compiles the mimalloc override object from libmimalloc-sys's sources (see build.rs).
cc = "1"
