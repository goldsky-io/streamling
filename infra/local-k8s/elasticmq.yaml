apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticmq
  namespace: streamling-e2e
  labels:
    app: elasticmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: elasticmq
  template:
    metadata:
      labels:
        app: elasticmq
    spec:
      containers:
        - name: elasticmq
          image: softwaremill/elasticmq-native:latest
          ports:
            - containerPort: 9324
              name: sqs
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 9324
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: elasticmq
  namespace: streamling-e2e
spec:
  type: NodePort
  selector:
    app: elasticmq
  ports:
    - name: sqs
      port: 9324
      targetPort: 9324
      nodePort: 30566
