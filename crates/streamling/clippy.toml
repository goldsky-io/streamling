# Raw spawn creates a detached task no drain can wait on — the orphan-task bug
# class from shutdown-investigation.md (Part 4). Spawn through
# `streamling_core::shutdown::ComponentScope::spawn` so the task is tracked and
# cancelled by the drain ladder. The two annotated exceptions in this crate are
# genuinely process-lifetime: the admin API server, and the shutdown trigger
# itself (the task that initiates the drain cannot be tracked by it).
disallowed-methods = [
    { path = "tokio::task::spawn", reason = "detached tasks outlive shutdown; use ComponentScope::spawn (streamling_core::shutdown) so the drain ladder tracks the task" },
    { path = "tokio::runtime::Handle::spawn", reason = "detached tasks outlive shutdown, and Handle::spawn bypasses the tokio::task::spawn deny; use ComponentScope::spawn (streamling_core::shutdown)" },
    { path = "tokio::task::JoinSet::spawn", reason = "JoinSet tasks are aborted on drop, not drained; use ComponentScope::spawn (streamling_core::shutdown) so teardown waits for them" },
]
